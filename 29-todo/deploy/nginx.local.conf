# 本机教学用：静态页 + 把 /user /todo 反代到 Gin
# 浏览器只访问 :8090（同源），Cloudflare Tunnel 也只暴露这一端口
# 启动（仓库根目录）：
#   mkdir -p 29-todo/logs 29-todo/tmp
#   nginx -p "$PWD/29-todo" -c deploy/nginx.local.conf
# 停止：
#   nginx -p "$PWD/29-todo" -c deploy/nginx.local.conf -s stop
# 改完配置后 reload：
#   nginx -p "$PWD/29-todo" -c deploy/nginx.local.conf -s reload

worker_processes  1;
error_log         logs/error.log;
pid               logs/nginx.pid;

events {
    worker_connections  64;
}

http {
    default_type  application/octet-stream;
    sendfile      on;
    access_log    logs/access.log;

    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/svg+xml                         svg;
        application/json                      json;
    }

    client_body_temp_path  tmp/client_body;
    proxy_temp_path        tmp/proxy;
    fastcgi_temp_path      tmp/fastcgi;
    uwsgi_temp_path        tmp/uwsgi;
    scgi_temp_path         tmp/scgi;

    server {
        listen       8090;
        # 本机 localhost；Cloudflare 随机域名也能进来（只有这一块 server）
        server_name  localhost _;
        root         web;
        index        index.html;

        location /user {
            proxy_pass         http://127.0.0.1:8089;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /todo {
            proxy_pass         http://127.0.0.1:8089;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
